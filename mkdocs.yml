site_name: Digital Garden
site_url: https://jnkk.github.io/mkdocs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: black
      accent: grey
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.path
    - navigation.prune
plugins:
  - tags
  - search
  - mermaid2:
      version: 10.0.2
  - redirects:
      redirect_maps:
        'Debian/proxmox.md': 'Selfhost/Servers/proxmox.md'
        'Selfhost/Servers/ubuntu24server.md': 'Debian/ubuntuserver.md'
        'AI-Research/Code-CLI/Phoenix-deployment-guide-2026.md': 'AI-Research/code-cli/Phoenix-deployment-guide-2026.md'
        'nota/koperasi.md': 'Notes/koperasi.md'
        'Nix/Nixos/IP.md': 'Nix/nixos/IP.md'
        'Nix/Nixos/Learning.md': 'Nix/nixos/Learning.md'
        'Local-LLM/speckit.md': 'Projects/garis-miring/speckit.md'
        'Local-LLM/speckit-plan.md': 'Projects/garis-miring/speckit-plan.md'
        'Local-LLM/speckit-planv2.md': 'Projects/garis-miring/speckit-planv2.md'
        'Local-LLM/garismiring.md': 'Projects/garis-miring/garismiring.md'
        'Local-LLM/phoenix.md': 'Projects/garis-miring/phoenix.md'

markdown_extensions:
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
